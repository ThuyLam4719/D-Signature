{% extends "layout.html" %} {% block title %}Đăng nhập Quản trị{% endblock %} {%
block content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 60vh"
>
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-lg border-0">
      <div class="card-header text-center bg-primary text-white py-3">
        <h4 class="mb-0">
          <i class="fas fa-user-lock me-2"></i>Đăng nhập Admin
        </h4>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label text-muted fw-bold">Tên đăng nhập</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-user text-primary"></i
              ></span>
              <input
                type="text"
                name="username"
                class="form-control border-start-0 ps-0 bg-light"
                placeholder="admin"
                required
                autofocus
              />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted fw-bold">Mật khẩu</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-light border-end-0"
                ><i class="fas fa-key text-primary"></i
              ></span>
              <input
                type="password"
                name="password"
                class="form-control border-start-0 ps-0 bg-light"
                placeholder="••••••"
                required
              />
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg fw-bold">
              Truy cập hệ thống
            </button>
          </div>
        </form>
      </div>
      <div class="card-footer text-center bg-light py-3">
        <a href="/" class="text-decoration-none text-secondary small"
          ><i class="fas fa-arrow-left me-1"></i> Quay về trang chủ</a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
